<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Bad Time Simulator</title>
  <meta name="description" content="A pure JavaScript port of Jcw87's Bad Time Simulator (Sans Fight), a non-commercial Undertale fan project.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-128.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
    #custom-file { display: none; }
    #paste-overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.85); font: 14px/1.4 monospace; color: #fff;
    }
    #paste-overlay[hidden] { display: none; }
    #paste-box { width: min(560px, 92vw); border: 3px solid #fff; padding: 12px; background: #000; }
    #paste-box p { margin: 0 0 8px; }
    #paste-text {
      box-sizing: border-box; width: 100%; height: 40vh; background: #000; color: #fff;
      border: 1px solid #888; font: 13px/1.3 monospace; padding: 6px; resize: vertical;
    }
    #paste-box .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    #paste-box button { font: inherit; background: #000; color: #fff; border: 2px solid #fff; padding: 4px 14px; cursor: pointer; }
    #paste-box button:hover, #paste-box button:focus { color: #ff0; border-color: #ff0; }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480" tabindex="0"></canvas>

  <input id="custom-file" type="file" accept=".csv,.txt,text/csv,text/plain">
  <div id="paste-overlay" hidden>
    <div id="paste-box">
      <p>Paste a custom attack (CSV text, same format as the original's custom attacks guide).</p>
      <textarea id="paste-text" spellcheck="false" placeholder="0,SansText,hello,&#10;0,EndAttack,,"></textarea>
      <div class="row">
        <button id="paste-cancel" type="button">Cancel (Esc)</button>
        <button id="paste-ok" type="button">Load (Ctrl+Enter)</button>
      </div>
    </div>
  </div>

  <!-- Plain scripts (not ES modules) so the game also runs when this file is opened from disk. -->
  <script src="js/constants.js"></script>
  <script src="js/util.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/functions.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/state.js"></script>
  <script src="js/data/sprites.js"></script>
  <script src="js/data/fonts.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/attacks.js"></script>
  <script src="js/data/sans-dialog.js"></script>
  <script src="js/data/credits.js"></script>
  <script src="js/physics/stepmove.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/render/tint.js"></script>
  <script src="js/render/canvas.js"></script>
  <script src="js/render/draw.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/battle/combatzone.js"></script>
  <script src="js/soul.js"></script>
  <script src="js/battle/sans.js"></script>
  <script src="js/attacks/sequencer.js"></script>
  <script src="js/attacks/bones.js"></script>
  <script src="js/attacks/platforms.js"></script>
  <script src="js/attacks/blasters.js"></script>
  <script src="js/attacks/menubones.js"></script>
  <script src="js/attacks/commands.js"></script>
  <script src="js/battle/damage.js"></script>
  <script src="js/ui/battlemenu.js"></script>
  <script src="js/battle/battle.js"></script>
  <script src="js/ui/mainmenu.js"></script>
  <script src="js/ui/customattack.js"></script>
  <script src="js/ui/touch.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/main.js"></script>
  <script>BTS.boot();</script>
</body>
</html>
